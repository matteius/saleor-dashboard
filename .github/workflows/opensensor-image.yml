name: OpenSensor dashboard image
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the immutable image (does not deploy)
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.publish }}
          tags: ghcr.io/${{ github.repository_owner }}/saleor-dashboard:${{ github.sha }}
          build-args: |
            API_URL=https://api.mattscoinage.com/graphql/
            APP_MOUNT_URI=/
            STATIC_URL=/
            SENTRY_RELEASE=saleor-dashboard@${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.OPENSENSOR_SENTRY_AUTH_TOKEN }}
