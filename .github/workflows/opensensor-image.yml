name: OpenSensor production dashboard
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "scripts/hosting/**"
      - ".github/workflows/opensensor-image.yml"
permissions:
  contents: read
  statuses: read
concurrency:
  group: opensensor-dashboard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s scripts/hosting -p 'test_*.py' -v
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v6
      - name: Verify latest production source on App Platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/hosting/dashboard_release.py --wait
